name: Scheduler - Liberar Turnos Expirados

on:
  schedule:
    - cron: '*/15 * * * *'  # Cada 15 minutos
  workflow_dispatch:

jobs:
  liberar-turnos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, pdo_pgsql, bcmath, zip
      - name: Install dependencies
        run: |
          cd proyecto
          composer install --no-dev --prefer-dist --no-interaction
      - name: Liberar turnos expirados y verificar backups
        run: |
          cd proyecto
          php artisan turnos:liberar-expirados
          php artisan backups:check-schedule
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_ENV: production
          APP_DEBUG: false
          APP_NAME: "Gestión de Turnos"
          APP_URL: ${{ secrets.APP_URL }}
          DB_CONNECTION: pgsql
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: 5432
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: require
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET }}
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync