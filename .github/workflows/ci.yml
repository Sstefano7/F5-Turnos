name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Escanea el árbol de working files (no el historial: los secretos ya
      # expuestos se resuelven rotándolos, no reescribiendo la historia).
      - name: Gitleaks (detect secrets in files)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
        with:
          args: detect --no-git --redact --exit-code 1

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite, bcmath, curl
          coverage: none

      - name: Install dependencies
        run: |
          cd proyecto
          composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cd proyecto
          cp .env.example .env 2>/dev/null || true
          php artisan key:generate --force

      - name: Run tests
        run: |
          cd proyecto
          php artisan test
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'turnos-canchas-frontend/package-lock.json'

      - name: Install dependencies
        run: cd turnos-canchas-frontend && npm ci

      - name: Run lint
        run: cd turnos-canchas-frontend && npm run lint

      - name: Build
        run: cd turnos-canchas-frontend && npm run build